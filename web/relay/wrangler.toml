# PERF-1's library relay (web/relay/README.md). Fill in the KV namespace id that `wrangler kv namespace create LIB` prints.
name = "perf1-library"
main = "worker.js"
compatibility_date = "2025-06-01"

[[kv_namespaces]]
binding = "LIB"
id = "7ff8b1576b2c4d858ca5f2a51e795891"

[vars]
# the sites allowed to call it (localhost is always allowed, for the dev site)
ORIGINS = "https://deamonslinky.github.io"

# the ADMIN secret is not here: `wrangler secret put ADMIN`
