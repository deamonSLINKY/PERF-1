name: Comment, question or something else
description: A comment, a question, an idea you are not ready to write up, a bit of feedback on how it plays.
body:
  - type: markdown
    attributes:
      value: Anything is welcome here: how it sounds, what you reached for and could not find, what you would change. Thank you.
  - type: textarea
    id: what
    attributes:
      label: What would you like to say?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: The boot card, or the site footer.
      placeholder: "0.13.0"
