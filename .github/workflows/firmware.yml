# SPDX-License-Identifier: GPL-3.0-only
# HYP-1 on GitHub: every push to the default branch builds the firmware with JieLi's toolchain (Linux
# x86-64, as GitHub's runners are), runs the tests, and publishes the site to this repository's GitHub
# Pages: the web installer with this build in it, the browser emulator, and the .fwsc to download.
#
# Once, in the repository's Settings > Pages: Source = "GitHub Actions". Then the installer is at
#   https://<you>.github.io/<repo>/install/
# Each build is a release build 1.B.N (from the run number), so the FM-1 can tell builds apart.
name: firmware
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld >/dev/null
          command -v wasm-ld >/dev/null || sudo ln -sf "$(ls /usr/bin/wasm-ld* | head -1)" /usr/local/bin/wasm-ld
      - name: JieLi toolchain and SDK (cached)
        id: jl
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1
      - name: Fetch them if not cached
        if: steps.jl.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || try tools/get_toolchain.sh
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Keep them for next time
        if: steps.jl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1
      - name: Version
        run: |
          N=$GITHUB_RUN_NUMBER
          echo "V=1.$((N / 100 % 100)).$((N % 100))" >> "$GITHUB_ENV"
      - name: Build the firmware
        run: |
          set -o pipefail
          ./build.sh --release "$V" 2>&1 | tee build.log || {
            # the log's end as an annotation too: readable from the run's summary and the API
            echo "::error title=build failed::$(tail -60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Tests
        run: |
          set -o pipefail
          tests/run_tests.sh 2>&1 | tee tests.log || {
            echo "::error title=tests failed::$(grep -A12 FAIL tests.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Site (installer, emulator, download)
        run: |
          EN_VERSION="$V" sh web/emu/build_clang.sh
          REPO_URL="https://github.com/$GITHUB_REPOSITORY" python3 tools/make_pages.py "build/amb-$V.fwsc" "$V" build/pages
      - uses: actions/upload-artifact@v4
        with:
          name: hyp1-firmware-${{ env.V }}
          path: build/amb-${{ env.V }}.fwsc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}install/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
