# SPDX-License-Identifier: GPL-3.0-only
# HYP-1 on GitHub: every push to the default branch builds the firmware with JieLi's toolchain (Linux
# x86-64, as GitHub's runners are), runs the tests, and publishes the site to this repository's GitHub
# Pages: the web installer with this build in it, the browser emulator, and the .fwsc to download.
# ECO-1 (eco1/, experimental, versions 0.x) is built alongside, its pages under eco/, and a dropdown on
# every page switches between the two.
#
# Once, in the repository's Settings > Pages: Source = "GitHub Actions". Then the installer is at
#   https://<you>.github.io/<repo>/install/
# Each build is a release build 1.B.N (from the run number), so the FM-1 can tell builds apart.
name: firmware
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  discussions: read          # the board: the Discussions categories, for giscus
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install Pillow cairosvg
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld >/dev/null
          command -v wasm-ld >/dev/null || sudo ln -sf "$(ls /usr/bin/wasm-ld* | head -1)" /usr/local/bin/wasm-ld
          mkdir -p ~/.fonts && cp eco1/assets/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null || true
      - name: JieLi toolchain and SDK (cached)
        id: jl
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1
      - name: Fetch them if not cached
        if: steps.jl.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || try tools/get_toolchain.sh
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Keep them for next time
        if: steps.jl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1
      - name: Version
        run: |
          N=$GITHUB_RUN_NUMBER
          # HYP-1: 1.0.N up to run 32; from run 33 on, 1.5.0 and up (a hundred builds a minor version)
          M=$((N - 33))
          if [ "$M" -ge 0 ]; then V="1.$((5 + M / 100)).$((M % 100))"; else V="1.$((N / 100 % 100)).$((N % 100))"; fi
          echo "V=$V" >> "$GITHUB_ENV"
          echo "EV=0.$((N / 100 % 100)).$((N % 100))" >> "$GITHUB_ENV"     # ECO-1: 0.x while it's experimental
      - name: Build the firmware
        run: |
          set -o pipefail
          ./build.sh --release "$V" 2>&1 | tee build.log || {
            # the log's end as an annotation too: readable from the run's summary and the API
            echo "::error title=build failed::$(tail -60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          # the size checks, as notices on the run's summary
          grep -E "^\s+ok\s" build.log | sed 's/^\s*ok\s*/::notice title=check::/' || true
      - name: Tests
        run: |
          set -o pipefail
          tests/run_tests.sh 2>&1 | tee tests.log || {
            echo "::error title=tests failed::$(grep -A12 FAIL tests.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Board (the repository's Discussions categories, for giscus)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) {
              id hasDiscussionsEnabled discussionCategories(first: 25) { nodes { id name } } } }' > build/board.json \
            || echo '{}' > build/board.json
          python3 -c "import json; r=json.load(open('build/board.json')).get('data',{}).get('repository') or {}; print('::notice title=board::' + ('Discussions on: ' + ', '.join(c['name'] for c in r['discussionCategories']['nodes']) if r.get('hasDiscussionsEnabled') else 'Discussions are off: the board waits (Settings > General > Features > Discussions)'))"
      - name: Site (installer, emulator, board, download)
        run: |
          EN_VERSION="$V" sh web/emu/build_clang.sh
          BOARD_JSON=build/board.json REPO_URL="https://github.com/$GITHUB_REPOSITORY" python3 tools/make_pages.py "build/amb-$V.fwsc" "$V" build/pages
      # ECO-1, experimental, in eco1/: its own build, tests, renders and pages under eco/. Its failure
      # never holds HYP-1 back: the site then goes out without ECO-1 (and without the dropdown).
      - name: ECO-1 (experimental) — build
        id: eco
        continue-on-error: true
        run: |
          set -o pipefail
          cd eco1
          sh build.sh --release "$EV" 2>&1 | tee build.log || {
            echo "::warning title=ECO-1 build failed::$(tail -60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          sh tests/run_tests.sh 2>&1 | tee tests.log || {
            echo "::warning title=ECO-1 tests failed::$(grep -A12 FAIL tests.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          mkdir -p build/site_shots
          build/host/amb_host tools/site/shots.amb build/site_shots > build/site_shots/log.txt
          python3 tools/site/mockups.py
          python3 tools/site/panda.py
          python3 tools/gen_manual_figures.py
          EN_VERSION="$EV" sh web/emu/build_clang.sh
          REPO_URL="https://github.com/$GITHUB_REPOSITORY/tree/main/eco1" python3 tools/make_pages.py "build/amb-$EV.fwsc" "$EV" ../build/pages/eco
      - name: The firmware dropdown on every page
        run: python3 tools/site/switcher.py build/pages
      - uses: actions/upload-artifact@v4
        with:
          name: hyp1-firmware-${{ env.V }}
          path: build/amb-${{ env.V }}.fwsc
      - uses: actions/upload-artifact@v4
        if: steps.eco.outcome == 'success'
        with:
          name: eco1-firmware-${{ env.EV }}
          path: eco1/build/amb-${{ env.EV }}.fwsc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}install/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
